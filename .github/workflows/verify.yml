name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            cpio

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project verification
        run: pnpm verify

      # Both formats: deb and rpm are configured separately in tauri.conf.json, and rpm is
      # the shipping path for this project's own Linux machine. Checking only one leaves the
      # other free to break into a silent "App info not found" on install.
      - name: Build unsigned Linux packages
        run: >-
          pnpm exec tauri build --bundles deb,rpm --ci --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: DEBUG bundle output (temporary)
        run: |
          echo "--- df -h ---"
          df -h .
          echo "--- bundle tree ---"
          find src-tauri/target/release/bundle -maxdepth 3 -exec ls -ld {} \;
          echo "--- rpm dir stat ---"
          stat src-tauri/target/release/bundle/rpm || echo "rpm dir stat failed: $?"
          echo "--- find rpm ---"
          find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print
          echo "find exit: $?"

      - name: DEBUG rpm payload (temporary)
        run: |
          set +e
          rpm_path="$(readlink -f "$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)")"
          echo "rpm path: $rpm_path"
          echo "--- payload info ---"
          rpm -qp --queryformat '%{PAYLOADCOMPRESSOR} %{PAYLOADFLAGS} %{PAYLOADFORMAT}\n' "$rpm_path"
          echo "rpm -qp exit: $?"
          echo "--- tool versions ---"
          rpm2cpio --version 2>&1
          cpio --version 2>&1 | head -1
          rpm --version
          echo "--- split extraction ---"
          mkdir -p /tmp/rpmdebug && cd /tmp/rpmdebug
          rpm2cpio "$rpm_path" > payload.cpio
          echo "rpm2cpio exit: $?"
          ls -la payload.cpio
          file payload.cpio
          cpio -idmv < payload.cpio
          echo "cpio exit: $?"
          find . -maxdepth 6 -type f
          exit 0

      - name: Verify portal desktop entry in Debian package
        run: scripts/verify-linux-package.sh "$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Verify portal desktop entry in RPM package
        run: |
          set -x
          bash -x scripts/verify-linux-package.sh "$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
