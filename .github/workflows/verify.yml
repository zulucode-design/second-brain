name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    container: registry.fedoraproject.org/fedora:44@sha256:1ccd18224d9b302fe62d3cefd0a9e0724c365ea8ac3bfb017c569540fe76433a
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          dnf install -y \
            git curl tar gzip gcc gcc-c++ shadow-utils util-linux \
            webkit2gtk4.1-devel \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            patchelf \
            rpm-build \
            cpio

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project verification
        run: |
          useradd --uid 1000 --home-dir "$HOME" verifier
          chown -R verifier:verifier "$HOME" "$GITHUB_WORKSPACE"
          runuser --user verifier --preserve-environment -- pnpm verify

      - name: Prepare pinned Syncthing sidecar
        run: pnpm sidecar:prepare

      # With no git in the container, checkout unpacks GitHub's archive, which records files as 0664,
      # and the RPM keeps the modes of the files it copies. A release and the Fedora test package
      # helper both need them not group-writable.
      - name: Build unsigned Fedora package
        run: |
          chmod -R go-w src-tauri
          pnpm exec tauri build --bundles rpm --ci --no-sign \
            --config '{"bundle":{"externalBin":["binaries/syncthing"],"createUpdaterArtifacts":false}}'

      - name: Verify portal desktop entry in RPM package
        run: scripts/verify-linux-package.sh "$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"

      # The Fedora test package helper refuses an RPM that fails this, so a gate would too.
      - name: Check RPM against the test package helper
        run: >-
          bash -c 'source scripts/linux-test-package.sh && { check_candidate "$1" || exit 1; }' check
          "$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"

  windows-rust:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Run Windows Rust tests
        run: pnpm test:rust

      - name: Verify pinned Windows sidecar preparation
        shell: pwsh
        run: |
          pnpm sidecar:prepare
          & ./src-tauri/binaries/syncthing-x86_64-pc-windows-msvc.exe --version
